<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Wuthering Waves Universe Map — Solaris-3 Interactive Map</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://game-cdn.appsample.com/js/leaflet.194.css" />
  
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #07090E;
      --panel-bg: rgba(12, 17, 29, 0.90);
      --panel-border: rgba(30, 41, 59, 0.8);
      --accent-cyan: #00E5FF;
      --accent-gold: #FFB703;
      --accent-purple: #9D4EDD;
      --accent-green: #06D6A0;
      --accent-red: #EF4444;
      --text-main: #F1F5F9;
      --text-muted: #94A3B8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: var(--bg-dark); font-family: 'Plus Jakarta Sans', sans-serif; color: var(--text-main); }
    
    #app { display: flex; width: 100vw; height: 100vh; position: relative; }
    #map { flex: 1; height: 100%; background: #06080D; z-index: 1; }

    /* Top Navigation Header */
    .top-bar {
      position: absolute;
      top: 16px;
      left: 16px;
      right: 16px;
      height: 58px;
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 18px;
      z-index: 1000;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-logo {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: linear-gradient(135deg, var(--accent-cyan), var(--accent-purple));
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
      color: #fff;
    }
    .brand-title {
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.5px;
    }
    .brand-title span { color: var(--accent-cyan); }
    .region-badge {
      font-family: 'JetBrains Mono', monospace;
      font-size: 11px;
      padding: 3px 8px;
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      color: var(--accent-cyan);
      border-radius: 6px;
    }

    .region-select {
      background: #0D1424;
      border: 1px solid rgba(255,255,255,0.15);
      color: #fff;
      padding: 8px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      outline: none;
    }

    /* Sidebar Filter Panel */
    .sidebar {
      position: absolute;
      top: 86px;
      left: 16px;
      width: 320px;
      max-height: calc(100vh - 102px);
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: 14px;
      z-index: 1000;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0,0,0,0.6);
      transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .sidebar.collapsed {
      transform: translateX(-340px);
    }

    .sidebar-header {
      padding: 14px 18px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .sidebar-header h3 { font-size: 14px; font-weight: 700; }
    .found-counter { font-size: 12px; color: var(--accent-cyan); font-family: 'JetBrains Mono'; }

    .sidebar-content {
      padding: 12px 14px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .filter-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 8px 10px;
      background: rgba(255,255,255,0.03);
      border: 1px solid rgba(255,255,255,0.05);
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s;
      user-select: none;
    }
    .filter-item:hover {
      background: rgba(255,255,255,0.07);
      border-color: rgba(255,255,255,0.15);
    }
    .filter-item.active {
      background: rgba(0, 229, 255, 0.08);
      border-color: rgba(0, 229, 255, 0.4);
    }
    .filter-label {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 13px;
      font-weight: 500;
    }
    .filter-icon {
      width: 24px;
      height: 24px;
      object-fit: contain;
    }
    .filter-count {
      font-size: 11px;
      font-family: 'JetBrains Mono';
      color: var(--text-muted);
      background: rgba(0,0,0,0.3);
      padding: 2px 6px;
      border-radius: 4px;
    }

    /* Toggle Panel Button */
    .sidebar-toggle-btn {
      position: absolute;
      top: 86px;
      left: 16px;
      width: 36px;
      height: 36px;
      background: var(--panel-bg);
      border: 1px solid var(--panel-border);
      border-radius: 8px;
      color: var(--text-main);
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 999;
      box-shadow: 0 4px 16px rgba(0,0,0,0.4);
    }

    /* Leaflet popup customization */
    .leaflet-popup-content-wrapper {
      background: #0B111E !important;
      color: #fff !important;
      border: 1px solid rgba(0, 229, 255, 0.4) !important;
      border-radius: 12px !important;
      box-shadow: 0 10px 30px rgba(0,0,0,0.8) !important;
    }
    .leaflet-popup-tip {
      background: #0B111E !important;
    }
    .popup-box {
      font-family: 'Plus Jakarta Sans', sans-serif;
      padding: 4px;
    }
    .popup-title {
      font-size: 14px;
      font-weight: 700;
      color: var(--accent-cyan);
      margin-bottom: 4px;
    }
    .popup-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .popup-btn {
      width: 100%;
      padding: 6px 12px;
      background: rgba(0, 229, 255, 0.15);
      border: 1px solid var(--accent-cyan);
      color: #fff;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    .popup-btn:hover {
      background: var(--accent-cyan);
      color: #000;
    }
    .popup-btn.collected {
      background: rgba(6, 214, 160, 0.2);
      border-color: var(--accent-green);
      color: var(--accent-green);
    }
  </style>
</head>
<body>
  <div id="app">
    <!-- Top Bar -->
    <div class="top-bar">
      <div class="brand">
        <div class="brand-logo">W</div>
        <div>
          <div class="brand-title">WUTHERING <span>WAVES</span></div>
        </div>
        <div class="region-badge" id="regionBadge">HUANGLONG OVERWORLD</div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px;">
        <select class="region-select" id="mapSelect">
          <option value="1">Huanglong (Main)</option>
          <option value="2">Tethys' Deep (Black Shores)</option>
          <option value="3">Rinascita</option>
          <option value="4">Riccioli Islands</option>
          <option value="8">Septimont</option>
          <option value="30">Lahai-Roi</option>
          <option value="35">Mengzhou</option>
        </select>
      </div>
    </div>

    <!-- Sidebar Panel -->
    <button class="sidebar-toggle-btn" id="sidebarToggle" title="Toggle Filters">☰</button>
    <div class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <h3>Exploration Markers</h3>
        <span class="found-counter" id="foundCounter">0 Found</span>
      </div>
      <div class="sidebar-content" id="filterList">
        <!-- Filter chips rendered dynamically -->
      </div>
    </div>

    <!-- Map Canvas -->
    <div id="map"></div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://game-cdn.appsample.com/js/leaflet.194.js"></script>
  
  <script>
    // MAP TILES CONFIGURATION (Game-Accurate High-Res Tiles)
    const MAPS_CONFIG = {
      1: {
        mid: 1,
        name: "Huanglong (Overworld)",
        url: "https://game-cdn.appsample.com/ww/map-main/v13-rc1/{z}/tile-{x}_{y}.jpg",
        minZoom: 11,
        maxZoom: 15,
        zoom: 12,
        center: [0.12, 0.08],
        tileBounds: {
          10: {minX: -2, maxX: 1, minY: -2, maxY: 1},
          11: {minX: -4, maxX: 2, minY: -4, maxY: 2},
          12: {minX: -7, maxX: 5, minY: -8, maxY: 5},
          13: {minX: -3, maxX: 9, minY: -7, maxY: 6},
          14: {minX: -7, maxX: 18, minY: -15, maxY: 11},
          15: {minX: -15, maxX: 36, minY: -31, maxY: 25}
        }
      },
      2: {
        mid: 2,
        name: "Tethys' Deep",
        url: "https://game-cdn.appsample.com/ww/map-black-shores/tethys-deep/{z}/tile-{x}_{y}.jpg",
        minZoom: 10,
        maxZoom: 12,
        zoom: 11,
        center: [0, 0]
      },
      3: {
        mid: 3,
        name: "Rinascita",
        url: "https://game-cdn.appsample.com/ww/map-rinascita/rc1/{z}/tile-{x}_{y}.jpg",
        minZoom: 10,
        maxZoom: 13,
        zoom: 11,
        center: [0, 0]
      },
      4: {
        mid: 4,
        name: "Riccioli Islands",
        url: "https://game-cdn.appsample.com/ww/map-riccioli/{z}/tile-{x}_{y}.jpg",
        minZoom: 10,
        maxZoom: 13,
        zoom: 11,
        center: [0, 0]
      },
      8: {
        mid: 8,
        name: "Septimont",
        url: "https://game-cdn.appsample.com/ww/map-septimont/v2/{z}/tile-{x}_{y}.jpg",
        minZoom: 10,
        maxZoom: 13,
        zoom: 11,
        center: [0, 0]
      },
      30: {
        mid: 30,
        name: "Lahai-Roi",
        url: "https://game-cdn.appsample.com/ww/map-lahairoi/v1/{z}/tile-{x}_{y}.jpg",
        minZoom: 10,
        maxZoom: 13,
        zoom: 11,
        center: [0, 0]
      },
      35: {
        mid: 35,
        name: "Mengzhou",
        url: "https://game-cdn.appsample.com/ww/map-mengzhou/rc1/{z}/tile-{x}_{y}.jpg",
        minZoom: 10,
        maxZoom: 13,
        zoom: 11,
        center: [0, 0]
      }
    };

    const MARKER_DEFS = {
      z1: { name: "Resonance Nexus", icon: "https://game-cdn.appsample.com/ww/markers-v1/z1.png" },
      z2: { name: "Resonance Beacon", icon: "https://game-cdn.appsample.com/ww/markers-v1/z2.png" },
      z7: { name: "Supply Chests", icon: "https://game-cdn.appsample.com/ww/markers-v1/z7-pin.png" },
      z3: { name: "Sonance Casket", icon: "https://game-cdn.appsample.com/ww/markers-v1/z3-pin.png" },
      z4: { name: "Viewpoint", icon: "https://game-cdn.appsample.com/ww/markers-v1/z4-pin.png" },
      z6: { name: "Blobfly", icon: "https://game-cdn.appsample.com/ww/markers-v1/z6-pin.png" },
      z10: { name: "Inspectable Box", icon: "https://game-cdn.appsample.com/ww/markers-v1/z10-pin.png" },
      z11: { name: "Book / Archive", icon: "https://game-cdn.appsample.com/ww/markers-v1/z11-pin.png" },
      z12: { name: "Side Quest", icon: "https://game-cdn.appsample.com/ww/markers-v1/z12-pin.png" },
      z13: { name: "Cave Entrance", icon: "https://game-cdn.appsample.com/ww/markers-v1/z13-pin.png" },
      z14: { name: "Frostbug", icon: "https://game-cdn.appsample.com/ww/markers-v1/z14-pin.png" }
    };

    let currentMid = 1;
    let map = null;
    let tileLayer = null;
    let markerLayerGroup = null;
    let allMarkersData = [];
    let activeFilters = new Set(["z1", "z2", "z7", "z3"]);
    let collectedMarkers = new Set(JSON.parse(localStorage.getItem('wuwa_collected_markers') || '[]'));

    // Initialize Map
    function initMap(mid) {
      const cfg = MAPS_CONFIG[mid] || MAPS_CONFIG[1];
      currentMid = mid;
      document.getElementById('regionBadge').innerText = cfg.name.toUpperCase();

      if (map) {
        map.remove();
      }

      map = L.map('map', {
        center: cfg.center,
        zoom: cfg.zoom,
        minZoom: cfg.minZoom,
        maxZoom: cfg.maxZoom,
        zoomControl: false,
        attributionControl: false,
        maxBounds: L.latLngBounds(L.latLng(1.5, 1.5), L.latLng(-1.5, -1.5))
      });

      L.control.zoom({ position: 'bottomright' }).addTo(map);

      // Custom AppSample / Kuro TMS Tile Loader
      const tileUrl = cfg.url
        .replace('{x}', '{getX}')
        .replace('{y}', '{getY}')
        .replace('{z}', '{getZ}');

      tileLayer = L.tileLayer(tileUrl, {
        tms: true,
        tileSize: 256,
        minZoom: cfg.minZoom,
        maxZoom: cfg.maxZoom,
        bounds: [[-1, -1], [1, 1]],
        getX: function(t) {
          const shift = Math.pow(2, t.z - 1);
          return t.x - shift;
        },
        getY: function(t) {
          const shift = Math.pow(2, t.z - 1);
          return t.y - shift;
        },
        getZ: function(e) {
          return e.z;
        }
      }).addTo(map);

      markerLayerGroup = L.layerGroup().addTo(map);
      renderMarkers();
    }

    // Render Filter Sidebar
    function renderFilters() {
      const filterContainer = document.getElementById('filterList');
      filterContainer.innerHTML = '';

      // Count occurrences in current map
      const counts = {};
      allMarkersData.forEach(m => {
        if (m[4] === currentMid) {
          counts[m[2]] = (counts[m[2]] || 0) + 1;
        }
      });

      Object.entries(MARKER_DEFS).forEach(([type, def]) => {
        const count = counts[type] || 0;
        if (count === 0 && !["z1", "z2", "z7", "z3"].includes(type)) return;

        const item = document.createElement('div');
        item.className = `filter-item ${activeFilters.has(type) ? 'active' : ''}`;
        item.onclick = () => {
          if (activeFilters.has(type)) {
            activeFilters.delete(type);
          } else {
            activeFilters.add(type);
          }
          item.classList.toggle('active');
          renderMarkers();
        };

        item.innerHTML = `
          <div class="filter-label">
            <img class="filter-icon" src="${def.icon}" onerror="this.src='https://game-cdn.appsample.com/ww/markers-v1/z7-pin.png'"/>
            <span>${def.name}</span>
          </div>
          <span class="filter-count">${count}</span>
        `;
        filterContainer.appendChild(item);
      });

      updateFoundCount();
    }

    // Render Markers on Map
    function renderMarkers() {
      if (!markerLayerGroup) return;
      markerLayerGroup.clearLayers();

      const filtered = allMarkersData.filter(m => m[4] === currentMid && activeFilters.has(m[2]));

      filtered.forEach(m => {
        const [id, s, type, rawType, mid, level, lng, lat, desc] = m;
        const isCollected = collectedMarkers.has(String(id));
        const def = MARKER_DEFS[type] || MARKER_DEFS.z7;

        const icon = L.icon({
          iconUrl: def.icon,
          iconSize: [28, 28],
          iconAnchor: [14, 14],
          popupAnchor: [0, -14],
          className: isCollected ? 'marker-collected' : ''
        });

        const marker = L.marker([lat, lng], { icon, opacity: isCollected ? 0.35 : 1.0 });

        const popupContent = document.createElement('div');
        popupContent.className = 'popup-box';
        popupContent.innerHTML = `
          <div class="popup-title">${def.name} #${id}</div>
          <div class="popup-desc">${desc ? desc : 'Exploration location on Solaris-3.'}</div>
          <button class="popup-btn ${isCollected ? 'collected' : ''}" id="btn-${id}">
            ${isCollected ? '✓ Completed' : 'Mark as Found'}
          </button>
        `;

        const btn = popupContent.querySelector(`#btn-${id}`);
        btn.onclick = () => {
          if (collectedMarkers.has(String(id))) {
            collectedMarkers.delete(String(id));
            btn.className = 'popup-btn';
            btn.innerText = 'Mark as Found';
            marker.setOpacity(1.0);
          } else {
            collectedMarkers.add(String(id));
            btn.className = 'popup-btn collected';
            btn.innerText = '✓ Completed';
            marker.setOpacity(0.35);
          }
          localStorage.setItem('wuwa_collected_markers', JSON.stringify([...collectedMarkers]));
          updateFoundCount();
        };

        marker.bindPopup(popupContent);
        markerLayerGroup.addLayer(marker);
      });
    }

    function updateFoundCount() {
      document.getElementById('foundCounter').innerText = `${collectedMarkers.size} Collected`;
    }

    // Setup Sidebar Toggle
    document.getElementById('sidebarToggle').onclick = () => {
      document.getElementById('sidebar').classList.toggle('collapsed');
    };

    // Region Switch Handler
    document.getElementById('mapSelect').onchange = (e) => {
      const mid = parseInt(e.target.value);
      initMap(mid);
      renderFilters();
    };

    // Fetch Verified Markers JSON & Boot
    fetch('data/exploration_markers.json')
      .then(res => res.json())
      .then(json => {
        allMarkersData = json.data;
        initMap(1);
        renderFilters();
      })
      .catch(err => {
        console.error('Failed loading markers:', err);
      });
  </script>
</body>
</html>
